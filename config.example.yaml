server:
  host: 172.18.0.1
  port: 19500

database:
  driver: sqlite                 # sqlite / mysql / postgres
  dsn: data/nx.db
  # mysql: user:pass@tcp(localhost:3306)/nxadmin?charset=utf8mb4&parseTime=True
  # postgres: host=localhost user=postgres password=xxx dbname=nxadmin port=5432 sslmode=disable

jwt:
  secret: nx-admin-jwt-secret-2024
  access_minutes: 30             # access token lifetime
  refresh_minutes: 10080         # refresh token lifetime (7 days)
  mfa_minutes: 5                 # interim token between password and MFA code

site:
  title: ""                      # browser tab title; empty -> 我的nxadmin
  favicon: ""                    # http(s)/data URL or local file path; empty -> built-in bull icon

cors:
  origins: "*"

# Strict cookie/MFA mode is only supported by app.NewRuntime, with explicit
# migration/bootstrap and one HTTPS session.origin equal to cors.origins.
# Legacy serve/Run keeps Bearer mode and rejects cookie: true before any writes.
session:
  cookie: false
  origin: ""
  trust_loopback_proxy: false

login:
  ip_whitelist_enabled: true
  rate_limit:
    enabled: true
    max_attempts: 5
    window_minutes: 5
    lock_minutes: 15

upload:
  dir: ./uploads
  max_size: 10485760
  driver: local                  # local / s3 (AWS S3, MinIO, Aliyun OSS, Tencent COS, R2)
  # Files already uploaded stay reachable after switching drivers; each record
  # remembers which driver holds it.
  s3:
    endpoint: ""                 # host[:port], no scheme, e.g. s3.amazonaws.com or 127.0.0.1:9000
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    use_ssl: true
    path_style: false            # true for MinIO
    prefix: ""                   # optional key prefix inside the bucket
    public_base_url: ""          # CDN/public bucket URL; empty = time-limited presigned links

captcha:
  enabled: true
  padding: 5

# Shared by login rate limiting, captcha and (later) session lookups.
# memory is per-process; use redis when running more than one instance.
cache:
  driver: memory                 # memory / redis
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0
    prefix: "nx:"
