server:
  host: 127.0.0.1                # use 0.0.0.0 to listen on all interfaces behind a proxy
  port: 19500
  # Client address behind a reverse proxy (Cloudflare -> nginx -> nxadmin).
  # Headers are read only when the TCP peer is in trusted_proxies, and only the
  # one named here, so a direct caller can not forge its address.
  #   trusted_proxies: IPs/CIDRs of your proxy; empty = loopback only.
  #   client_ip_header: X-Forwarded-For (default) / X-Real-IP / CF-Connecting-IP; "" = ignore headers.
  # Recommended: nginx real_ip module (set_real_ip_from <Cloudflare ranges>;
  # real_ip_header CF-Connecting-IP) plus `proxy_set_header X-Real-IP $remote_addr;`,
  # then set client_ip_header: X-Real-IP. Only trust CF-Connecting-IP directly if the
  # origin firewall admits Cloudflare ranges alone.
  trusted_proxies: []
  client_ip_header: X-Forwarded-For

database:
  driver: sqlite                 # sqlite / mysql / postgres
  dsn: data/nx.db
  # mysql: user:pass@tcp(localhost:3306)/nxadmin?charset=utf8mb4&parseTime=True
  # postgres: host=localhost user=postgres password=xxx dbname=nxadmin port=5432 sslmode=disable

jwt:
  # Leave empty (recommended): a random key is generated on first start and kept
  # in secret_file, so restarts keep sessions valid. Set it (>= 32 bytes, e.g.
  # `openssl rand -hex 32`, or NX_JWT_SECRET) to share one key across instances.
  # A short or published-default value is rejected / ignored.
  secret: ""
  secret_file: data/jwt.secret   # keep this file private (created with mode 0600)
  access_minutes: 30             # access token lifetime
  refresh_minutes: 10080         # refresh token lifetime (7 days)
  mfa_minutes: 5                 # interim token between password and MFA code

site:
  title: ""                      # browser tab title; empty -> 信息管理系统
  favicon: ""                    # http(s)/data URL or local file path; empty -> built-in bull icon

cors:
  # Empty (default): the app sends no CORS headers - let the reverse proxy
  # (nginx) own CORS. Otherwise list exact origins, comma-separated;
  # wildcards are rejected.
  origins: ""

# Strict cookie/MFA mode is only supported by app.NewRuntime, with explicit
# migration/bootstrap and one HTTPS session.origin equal to cors.origins.
# Legacy serve/Run keeps Bearer mode and rejects cookie: true before any writes.
session:
  cookie: false
  origin: ""
  trust_loopback_proxy: false

login:
  ip_whitelist_enabled: true
  rate_limit:
    enabled: true
    max_attempts: 5
    window_minutes: 5
    lock_minutes: 15

upload:
  dir: ./uploads
  max_size: 10485760
  # Permitted extensions (default: common images, documents, archives, audio/video).
  # html/svg/js and other active formats are always refused. Content is sniffed,
  # so a renamed file is rejected too.
  # allow_types: [jpg, png, pdf]
  driver: local                  # local / s3 (AWS S3, MinIO, Aliyun OSS, Tencent COS, R2)
  # Files already uploaded stay reachable after switching drivers; each record
  # remembers which driver holds it.
  s3:
    endpoint: ""                 # host[:port], no scheme, e.g. s3.amazonaws.com or 127.0.0.1:9000
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    use_ssl: true
    path_style: false            # true for MinIO
    prefix: ""                   # optional key prefix inside the bucket
    public_base_url: ""          # CDN/public bucket URL; empty = time-limited presigned links

captcha:
  enabled: true
  padding: 5

# Shared by login rate limiting, captcha and (later) session lookups.
# memory is per-process; use redis when running more than one instance.
cache:
  driver: memory                 # memory / redis
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0
    prefix: "nx:"
